services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: devbot-server:latest
    container_name: devbot-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CLIENT_ORIGIN=*
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - devbot-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: devbot-client:latest
    container_name: devbot-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - devbot-network

networks:
  devbot-network:
    driver: bridge
